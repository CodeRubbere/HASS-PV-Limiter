# PV inverter logging modbus TCP/IP
#
# Revision: v1.0 2026/06/16

modbus:
  - name: PV2
    type: tcp
    host: 10.10.30.218 ## or create !secret inverter_ip with ip adress
    port: 502
    delay: 5
    message_wait_milliseconds: 600
    timeout: 5

    sensors:
      - name: PV2 Actual
        unique_id: pv2_actual
        scan_interval: 10
        unit_of_measurement: W
        slave: 3
        address: 30775
        input_type: input
        data_type: int32
        min_value: 0
        device_class: power
        state_class: measurement
      # 2026-08-09: state_class removed from both counters below - see the
      # matching note in modbus_tcp_pv1.yaml. Short version: these are raw
      # cumulative registers feeding gauges only, and on a `total_increasing`
      # sensor every dropped frame or wake-up 0-read becomes phantom
      # production in long-term statistics.
      - name: PV2 Daily
        unique_id: pv2_daily
        scan_interval: 300
        unit_of_measurement: kWh
        scale: 0.001
        precision: 2
        slave: 3
        address: 30517
        data_type: int64
        min_value: 0
        device_class: energy
      - name: PV2 Total
        unique_id: pv2_total
        # 2026-08-11: 300 -> 30, and precision 4 -> 6 below. See the matching
        # note in modbus_tcp_pv1.yaml. Short version: this register feeds the
        # PV segment of custom:energy-balance-card, and a 5 minute poll at
        # 0.1 kWh granularity left that figure visibly frozen.
        scan_interval: 30
        unit_of_measurement: MWh
        slave: 3
        # 30529 = Total yield in Wh (U32). The U64 register 30513 returned a
        # bogus near-constant value (~1e10) on this inverter, so we read the
        # U32 register instead. Scale 0.000001 converts Wh -> MWh. nan_value
        # filters the max-value reading SMA inverters report while asleep.
        address: 30529
        input_type: input
        scale: 0.000001
        # precision 6 = 1 Wh resolution, the register's native granularity
        # (it holds Wh; scale 0.000001 presents it as MWh).
        precision: 6
        data_type: uint32
        nan_value: 4294967295
        min_value: 0
        device_class: energy
      - name: PV2 AC Voltage
        unique_id: pv2_ac_voltage
        scan_interval: 60
        unit_of_measurement: V
        slave: 3
        address: 30783
        input_type: input
        scale: 0.01
        precision: 2
        data_type: int32
        min_value: 0
        device_class: voltage
        state_class: measurement
      - name: PV2 AC Frequency
        unique_id: pv2_ac_frequency
        scan_interval: 60
        unit_of_measurement: Hz
        slave: 3
        address: 30803
        input_type: input
        scale: 0.01
        precision: 2
        data_type: int32
        min_value: 0
        device_class: frequency
        state_class: measurement
      - name: PV2 DC Voltage 1
        unique_id: pv2_dc_voltage_1
        scan_interval: 60
        unit_of_measurement: V
        slave: 3
        address: 30771
        input_type: input
        scale: 0.01
        precision: 1
        data_type: int32
        min_value: 0
        device_class: voltage
        state_class: measurement
      - name: PV2 DC Current 1
        unique_id: pv2_dc_current_1
        scan_interval: 60
        unit_of_measurement: A
        slave: 3
        address: 30769
        input_type: input
        scale: 0.001
        precision: 2
        data_type: int32
        min_value: 0
        device_class: current
        state_class: measurement
      - name: PV2 DC Power 1
        unique_id: pv2_dc_power_1
        scan_interval: 15
        unit_of_measurement: W
        slave: 3
        address: 30773
        input_type: input
        data_type: int32
        min_value: 0
        device_class: power
        state_class: measurement
      - name: PV2 DC Voltage 2
        unique_id: pv2_dc_voltage_2
        scan_interval: 60
        unit_of_measurement: V
        slave: 3
        address: 30959
        input_type: input
        scale: 0.01
        precision: 1
        data_type: int32
        min_value: 0
        device_class: voltage
        state_class: measurement
      - name: PV2 DC Current 2
        unique_id: pv2_dc_current_2
        scan_interval: 60
        unit_of_measurement: A
        slave: 3
        address: 30957
        input_type: input
        scale: 0.001
        precision: 2
        data_type: int32
        min_value: 0
        device_class: current
        state_class: measurement
      - name: PV2 DC Power 2
        unique_id: pv2_dc_power_2
        scan_interval: 15
        unit_of_measurement: W
        slave: 3
        address: 30961
        input_type: input
        data_type: int32
        min_value: 0
        device_class: power
        state_class: measurement
      - name: PV2 temperature
        unique_id: pv2_temperature
        scan_interval: 300
        unit_of_measurement: °C
        slave: 3
        address: 30953
        input_type: input
        scale: 0.1
        precision: 1
        data_type: int32
        min_value: 0
        device_class: temperature
        state_class: measurement
      - name: PV2 isolatieweerstand
        unique_id: pv2_isolatieweerstand
        scan_interval: 300
        unit_of_measurement: Ohm
        slave: 3
        address: 30225
        input_type: input
        scale: 0.001
        precision: 0
        data_type: int32
        min_value: 0
        ##        device_class: resistance
        state_class: measurement
      - name: PV2 aardlekkage
        unique_id: pv2_aardlekkage
        scan_interval: 300
        unit_of_measurement: A
        slave: 3
        address: 31247
        input_type: input
        scale: 0.001
        precision: 3
        data_type: int32
        min_value: 0
        device_class: current
        state_class: measurement
      - name: PV2 status
        unique_id: pv2_status
        scan_interval: 300
        slave: 3
        address: 30201
        data_type: int32
      - name: PV2 grid
        unique_id: pv2_grid
        scan_interval: 300
        slave: 3
        address: 30217
        data_type: uint32
      - name: PV2 limit percent
        unique_id: pv2_limit_percent
        scan_interval: 60
        unit_of_measurement: "%"
        slave: 3
        address: 41255
        input_type: holding
        data_type: int16
        min_value: 0
        scale: 0.01
        precision: 0
        state_class: measurement

template:
  # ---------------------------------------------------------------------------------------
  # 2026-08-11: migrated out of the legacy `sensor: - platform: template` format, together
  # with the PV1 set - see the note in modbus_tcp_pv1.yaml for why they had gone
  # unavailable and what that cost downstream. unique_ids unchanged, so the entity_ids and
  # their history are kept; `availability` is new, so an unreadable register no longer
  # reports 0 W to the PV energy integration.
  # ---------------------------------------------------------------------------------------
  - sensor:
      - name: "PV2 Power"
        unique_id: pv2_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:flash
        availability: "{{ has_value('sensor.pv2_actual') }}"
        state: >-
          {% set w = states('sensor.pv2_actual') | float(0) %}
          {{ (0 if (w < 0 or w > 10000) else w) | round(0) | int }}

      - name: "PV2 Energy Daily"
        unique_id: pv2_energie_vandaag
        unit_of_measurement: "kWh"
        icon: mdi:weather-sunny
        availability: "{{ has_value('sensor.pv2_daily') }}"
        state: >-
          {% set e = states('sensor.pv2_daily') | float(0) %}
          {{ 0 if (e < 0 or e > 10000) else e }}

      - name: "PV2 Grid relais"
        unique_id: pv2_grid_connector
        icon: mdi:connection
        state: "{{ 'Closed' if is_state('sensor.pv2_grid', '51') else 'Open' }}"


  - number:
      - name: PV2 Power Limit Slider
        unique_id: pv2_power_limit_slider
        icon: mdi:tune-variant
        unit_of_measurement: "%"
        state: 100
        set_value:
          - service: modbus.write_register
            data:
              hub: PV2
              address: 40016
              slave: 3
              value: "{{ value | int }}"
        step: 1
        min: 0
        max: 100
        optimistic: true

  - sensor:
      - name: "PV2 Inverter Status"
        unique_id: pv2_inverter_status
        state: >-
          {% if is_state('sensor.pv2_status', '307') %}
            OK
          {% elif is_state('sensor.pv2_status', '303') %}
            Off
          {% elif is_state('sensor.pv2_status', '455') %}
            Warning
          {% elif is_state('sensor.pv2_status', '35') %}
            Fault
          {% else %}
            Unknown
          {% endif %}
        icon: mdi:state-machine

      # Lifetime yield of PV2 in kWh.
      # See the matching block in modbus_tcp_pv1.yaml for the full rationale.
      #
      # THIS ENTITY MUST KEEP state_class - do not strip it. It feeds
      # custom:energy-balance-card (Consumption From -> PV) and the hourly
      # PV1/PV2 statistics-graph on the Home dashboard, both of which read
      # long-term statistics and go blank without it.
      #
      # 2026-08-09: never-decrease guard removed (it keyed off `this.state`,
      # which is not restored across restarts, so it re-seeded on every restart
      # and latched onto bad HIGH reads). Availability `> 0` replaces it and
      # masks the inverter wake-up 0-read.
      # 2026-08-11: state_class restored after the strip blanked those cards.
      # Safe to record now because the daily/yearly PV meters run off
      # sensor.pv2_energy_integral instead - a bad frame here can no longer
      # reach the YTD badge.
      - name: "PV2 Total Production"
        unique_id: pv2_total_production
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        availability: >
          {{ (states('sensor.pv2_total') | float(0)) > 0 }}
        state: >
          {# pv2_total is in MWh (register 30529 in Wh, scale 0.000001);
             convert to kWh here so the value matches unit_of_measurement.
             2026-07-22: this fixes the yearly/daily PV meters undercounting
             by a factor 1000 (they were fed MWh numbers labeled kWh).
             2026-08-11: round(1) -> round(6). round(1) quantised to 0.1 kWh
             and cancelled out the precision: 6 change upstream. The register
             counts whole Wh, so 0.001 kWh is the real resolution and digits
             4-6 will always read zero; round(6) just imposes no floor of its
             own and trims float noise from the multiply. #}
          {{ (states('sensor.pv2_total') | float(0) * 1000) | round(6) }}